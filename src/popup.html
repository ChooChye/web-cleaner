<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Web Cleaner</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="popup">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m16 22-1-4" />
          <path d="M19 14a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2h-3a1 1 0 0 1-1-1V4a2 2 0 0 0-4 0v5a1 1 0 0 1-1 1H6a2 2 0 0 0-2 2v1a1 1 0 0 0 1 1" />
          <path d="M5 14h14l1.97 6.77A1 1 0 0 1 20 22H4a1 1 0 0 1-.97-1.23z" />
          <path d="m8 22 1-4" />
        </svg>
      </span>
      <h1>Web Cleaner</h1>
    </header>

    <section id="siteCard" class="site">
      <span id="siteIcon" class="site-icon" aria-hidden="true"></span>
      <div class="site-text">
        <p id="site" class="site-host">Detecting site…</p>
        <p id="siteNote" class="site-note" hidden></p>
      </div>
    </section>

    <div class="controls">
      <button id="clearAll" class="btn btn-primary" title="Removes cookies, cache, Cache Storage, local storage, IndexedDB and service workers" disabled>
        <span class="btn-label">Clear all site data</span>
        <span class="btn-detail">Cookies, cache, storage and service workers</span>
      </button>

      <div class="controls-row">
        <button id="clearCache" class="btn btn-secondary" title="Removes the HTTP cache and Cache Storage" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="9" ry="3" />
            <path d="M3 5v14a9 3 0 0 0 18 0V5" />
            <path d="M3 12a9 3 0 0 0 18 0" />
          </svg>
          <span class="btn-label">Clear cache</span>
        </button>

        <button id="clearCookies" class="btn btn-secondary" title="Signs you out of this site" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" />
            <path d="M8.5 8.5v.01" />
            <path d="M16 15.5v.01" />
            <path d="M12 12v.01" />
            <path d="M11 17v.01" />
            <path d="M7 14v.01" />
          </svg>
          <span class="btn-label">Clear cookies</span>
        </button>
      </div>
    </div>

    <p id="status" class="status" role="status"></p>

    <footer class="credit">
      <span>Made with ❤️ by <a href="https://github.com/ChooChye" target="_blank" rel="noopener">ChooChye</a></span>
      <a href="https://github.com/ChooChye/web-cleaner/issues/new" target="_blank" rel="noopener">Report an issue</a>
    </footer>
  </main>

  <script type="module" src="popup.ts"></script>
</body>
</html>
